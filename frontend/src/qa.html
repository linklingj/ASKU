<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASKU — 그래프 QA</title>
<!-- SchoolQA.dc.html 을 DC(React) 런타임 없이 이식. 디자인 시스템 토큰(styles.css)·Archivo 계승, 그래프는 d3 로만 구동. -->
<link rel="stylesheet" href="_ds/modernist-c94de0c9-726d-442a-9bb3-d3b24f39b8cb/styles.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,'Archivo',sans-serif);-webkit-font-smoothing:antialiased;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  input{font-family:inherit;}
  input:focus{outline:none;}
  ::selection{background:color-mix(in srgb,var(--color-accent,#ec3013) 22%,transparent);}
  @keyframes qa-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  /* style-hover 이식: 인라인 base 값을 덮어야 해서 !important */
  .qa-type:hover{background:color-mix(in srgb,var(--color-text,#201e1d) 6%,transparent)!important;}
  .qa-nb:hover,.qa-src:hover,.qa-chip:hover{border-color:var(--color-text,#201e1d)!important;}
  .qa-invert:hover,.qa-sbtoggle:hover{background:var(--color-text,#201e1d)!important;color:var(--color-bg,#f3f2f2)!important;}
  .qa-x:hover{color:var(--color-accent,#ec3013)!important;}
  .qa-ask:hover{background:var(--color-accent,#ec3013)!important;}
  #qa-sbbody::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="qa-app" style="position:relative;height:100vh;width:100%;overflow:hidden;display:flex;">

  <aside id="qa-aside" style="position:relative;z-index:20;flex:0 0 auto;width:320px;overflow:hidden;border-right:2px solid var(--color-divider,#d8d5d4);background:var(--color-bg,#f3f2f2);transition:width .34s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;">
    <div id="qa-sbbody" style="width:318px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:auto;"></div>
  </aside>

  <button data-act="toggleSb" class="qa-sbtoggle" style="position:absolute;top:26px;left:calc(320px + 20px);z-index:40;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid var(--color-text,#201e1d);background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);cursor:pointer;font-size:15px;font-weight:800;line-height:1;transition:left .34s cubic-bezier(.2,.7,.2,1),background .18s ease,color .18s ease;padding:0;">‹</button>

  <main style="position:relative;flex:1 1 auto;min-width:0;">
    <div id="qa-graph" style="position:absolute;inset:0;"></div>

    <div style="position:absolute;top:26px;right:28px;z-index:15;display:flex;align-items:center;gap:14px;">
      <span style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 45%,transparent);">드래그 · 휠 확대</span>
      <button data-act="reset" class="qa-invert" style="border:2px solid var(--color-text,#201e1d);background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.04em;padding:9px 14px;cursor:pointer;transition:background .18s ease,color .18s ease;">레이아웃 초기화</button>
      <a href="find.html" data-act="back" class="qa-invert" style="display:inline-flex;align-items:center;gap:8px;border:2px solid var(--color-text,#201e1d);background:var(--color-bg,#f3f2f2);font-weight:700;font-size:12px;letter-spacing:.04em;padding:9px 14px;transition:background .18s ease,color .18s ease;">← 학교 변경</a>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;z-index:25;padding:0 28px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--color-bg,#f3f2f2) 92%,transparent) 46%);">

      <div id="qa-answer" style="width:100%;max-width:820px;display:flex;justify-content:center;"></div>

      <div id="qa-chips" style="pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;"></div>

      <div style="pointer-events:auto;width:100%;max-width:820px;padding:2.5px;border-radius:44px;background:linear-gradient(90deg,#3f9be0 0%,#6d5df0 38%,#a63fd0 66%,#ec3197 100%);box-shadow:0 10px 30px color-mix(in srgb,var(--color-text,#201e1d) 12%,transparent);">
        <div style="display:flex;align-items:center;gap:0;background:var(--color-surface,#fff);border-radius:42px;padding:0 10px 0 22px;height:66px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:0 0 auto;color:var(--color-text,#201e1d);"><circle cx="11" cy="11" r="7"></circle><line x1="16.2" y1="16.2" x2="21" y2="21"></line></svg>
          <span style="width:1px;height:30px;background:color-mix(in srgb,var(--color-text,#201e1d) 20%,transparent);margin:0 18px 0 16px;flex:0 0 auto;"></span>
          <input id="qa-input" placeholder="학교에 대해 무엇이든 물어보세요" style="flex:1 1 auto;min-width:0;border:0;background:transparent;font-size:19px;font-weight:500;letter-spacing:-.01em;color:var(--color-text,#201e1d);padding:0;height:100%;">
          <button data-act="ask" class="qa-ask" style="flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2);cursor:pointer;font-size:19px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .18s ease;">↑</button>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
(function () {
  "use strict";
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  var TYPES = [
    { key: "dept",   label: "학과",   color: "#ec3013", r: 12, meta: "단과대 소속 학과 · 커리큘럼 허브" },
    { key: "course", label: "강의",   color: "#1f6f8b", r: 8,  meta: "개설 강의 · 강의계획서 연결" },
    { key: "prof",   label: "교수",   color: "#c98b00", r: 8,  meta: "담당 교수 · 연구실 정보" },
    { key: "doc",    label: "문서",   color: "#6b6764", r: 6,  meta: "학사 문서 · 규정 및 안내" },
    { key: "notice", label: "공지",   color: "#9b2f6e", r: 6,  meta: "학사 공지 · 기한 있는 안내" }
  ];
  var SCHOOL = { name: "세종대학교", en: "Sejong University" };
  var DEPTS = [
    ["컴퓨터공학과", ["자료구조", "운영체제", "인공지능", "컴파일러"], ["김도현 교수", "이서준 교수"]],
    ["소프트웨어학과", ["웹서비스설계", "데이터베이스", "분산시스템"], ["박하늘 교수"]],
    ["전자정보통신공학과", ["신호및시스템", "회로이론", "무선통신"], ["정민우 교수", "한지수 교수"]],
    ["경영학과", ["재무관리", "마케팅원론", "조직행동론"], ["오세영 교수"]],
    ["건축학과", ["설계스튜디오", "구조역학", "도시계획"], ["윤재현 교수"]],
    ["디자인이노베이션", ["시각디자인", "인터랙션디자인"], ["강은비 교수"]]
  ];
  var DOCS = ["졸업요건 안내", "수강신청 매뉴얼", "전공로드맵", "실험실 안전규정", "학점교류 절차", "복수전공 신청서", "장학금 지급 기준", "교환학생 안내", "학사경고 규정", "논문 제출 지침"];
  var NOTICES = ["2026-2학기 수강신청 일정", "장학금 신청 마감 안내", "졸업논문 심사 공고", "교내 장비 대여 변경", "계절학기 개설 공지"];
  var CHIPS = ["졸업요건이 어떻게 되나요?", "수강신청 일정 알려줘", "복수전공 신청 절차"];
  var LABEL_MODE = "auto"; // DC 프롭 labelMode(auto|hubs|all) 기본값. UI 미노출 — 필요하면 여기서 조정.

  // ?school= 로 사이드바 제목만 바꿀 수 있음(그래프 데이터는 세종대 샘플 고정 — 백엔드 연동 시 교체).
  var SCHOOL_NAME = new URLSearchParams(location.search).get("school") || SCHOOL.name;

  var state = { sidebar: true, off: {}, selId: null, q: "", busy: false, ans: null, srcIds: [] };
  var nodes, rawLinks, byId, adj, rootId;
  var svg, gLayer, lLayer, nLayer, zoom, sim, drag, lSel, nSel, hover = null;
  var _ro, _rf, _t, _a;

  var host = function () { return document.getElementById("qa-graph"); };

  function setState(patch, cb) { for (var k in patch) state[k] = patch[k]; render(); if (cb) cb(); }
  function meta(n) { var t = TYPES.find(function (x) { return x.key === n.type; }); return { color: t ? t.color : "#201e1d", label: t ? t.label : "학교", r: t ? t.r : 17 }; }
  function visNodes() { return nodes.filter(function (n) { return n.type === "school" || !state.off[n.type]; }); }

  // ── 그래프 데이터 빌드 (DC build() 이식) ──────────────────────────
  function build() {
    var N = [], L = [], id = 0;
    var add = function (name, type, extra) { var n = { id: "n" + id++, name: name, type: type }; if (extra) for (var k in extra) n[k] = extra[k]; N.push(n); return n; };
    var link = function (a, b, w) { L.push({ s: a.id, t: b.id, w: w || 1 }); };

    var root = add(SCHOOL.name, "school"); rootId = root.id;
    var d = 0;
    DEPTS.forEach(function (row) {
      var dn = row[0], courses = row[1], profs = row[2];
      var dept = add(dn, "dept", { note: (courses.length + "개 강의 · " + profs.length + "명 교수") });
      link(root, dept, 2);
      var cs = courses.map(function (cn) { var c = add(cn, "course", { note: dn }); link(dept, c); return c; });
      profs.forEach(function (pn) { var p = add(pn, "prof", { note: dn }); link(dept, p, 1.5); cs.slice(0, 2).forEach(function (c) { link(p, c); }); });
      cs.forEach(function (c, i) {
        var doc = add(DOCS[(d * 3 + i) % DOCS.length], "doc", { note: dn + " · " + c.name });
        link(c, doc);
        if (i > 0) link(cs[i - 1], c, 0.6);
      });
      d++;
    });
    var depts = N.filter(function (n) { return n.type === "dept"; });
    NOTICES.forEach(function (nt, i) { var n = add(nt, "notice", { note: "학사팀 공지" }); link(root, n, 1.4); link(depts[i % depts.length], n, 0.8); });
    DOCS.slice(0, 4).forEach(function (dn, i) { var g = add(dn, "doc", { note: "전체 학사 공통" }); link(root, g); link(depts[(i + 2) % depts.length], g, 0.7); });

    nodes = N; rawLinks = L;
    byId = new Map(N.map(function (n) { return [n.id, n]; }));
    adj = new Map(N.map(function (n) { return [n.id, new Set()]; }));
    L.forEach(function (l) { adj.get(l.s).add(l.t); adj.get(l.t).add(l.s); });
  }

  // ── d3 그래프 (DC init/fit/tick/resize/draw/style 이식) ───────────
  function waitD3() {
    var h = host();
    if (window.d3 && h && h.clientWidth) {
      init();
      _ro = new ResizeObserver(function () { cancelAnimationFrame(_rf); _rf = requestAnimationFrame(resize); });
      _ro.observe(h);
      return;
    }
    _t = setTimeout(waitD3, 60);
  }

  function init() {
    var d3 = window.d3, h = host();
    if (!h) return;
    var w = h.clientWidth || 900, ht = h.clientHeight || 700;
    svg = d3.select(h).append("svg").attr("width", "100%").attr("height", "100%").style("display", "block").style("cursor", "grab");
    gLayer = svg.append("g");
    lLayer = gLayer.append("g").attr("stroke", "#201e1d");
    nLayer = gLayer.append("g");

    zoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", function (e) { gLayer.attr("transform", e.transform); });
    svg.call(zoom).on("dblclick.zoom", null);
    svg.on("click", function (e) { if (e.target.tagName === "svg") setState({ selId: null }); });

    nodes.forEach(function (n) { n.x = w / 2 + (Math.random() - 0.5) * 260; n.y = ht / 2 + (Math.random() - 0.5) * 260; });

    sim = d3.forceSimulation()
      .force("link", d3.forceLink().id(function (x) { return x.id; }).distance(function (l) { return 40 + 26 / (l.w || 1); }).strength(function (l) { return 0.35 * (l.w || 1); }))
      .force("charge", d3.forceManyBody().strength(function (n) { return n.type === "school" ? -420 : n.type === "dept" ? -240 : -110; }).distanceMax(420))
      .force("x", d3.forceX(w / 2).strength(0.06))
      .force("y", d3.forceY(ht / 2).strength(0.08))
      .force("collide", d3.forceCollide(function (n) { return meta(n).r + 11; }))
      .on("tick", tick)
      .on("end", function () { fit(500); });

    drag = d3.drag()
      .on("start", function (e, n) { if (!e.active) sim.alphaTarget(0.22).restart(); n.fx = n.x; n.fy = n.y; })
      .on("drag", function (e, n) { n.fx = e.x; n.fy = e.y; })
      .on("end", function (e, n) { if (!e.active) sim.alphaTarget(0); n.fx = null; n.fy = null; });

    draw();
    setTimeout(function () { fit(500); }, 1100);
  }

  function fit(ms) {
    var h = host(), d3 = window.d3;
    if (!h || !svg || !sim) return;
    var ns = sim.nodes(); if (!ns.length) return;
    var w = h.clientWidth, ht = h.clientHeight, pad = 64;
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ns.forEach(function (n) { var r = meta(n).r + 22; x0 = Math.min(x0, n.x - r); x1 = Math.max(x1, n.x + r); y0 = Math.min(y0, n.y - r); y1 = Math.max(y1, n.y + r); });
    var bw = x1 - x0, bh = y1 - y0; if (!bw || !bh) return;
    var k = Math.max(0.3, Math.min(1.6, Math.min((w - pad * 2) / bw, (ht - pad * 2 - 90) / bh)));
    var t = d3.zoomIdentity.translate(w / 2 - k * (x0 + x1) / 2, (ht - 70) / 2 - k * (y0 + y1) / 2).scale(k);
    svg.transition().duration(ms || 0).call(zoom.transform, t);
  }

  function tick() {
    if (lSel) lSel.attr("x1", function (l) { return l.source.x; }).attr("y1", function (l) { return l.source.y; }).attr("x2", function (l) { return l.target.x; }).attr("y2", function (l) { return l.target.y; });
    if (nSel) nSel.attr("transform", function (n) { return "translate(" + n.x + "," + n.y + ")"; });
  }

  function resize() {
    var h = host(); if (!h || !sim) return;
    var w = h.clientWidth, ht = h.clientHeight;
    sim.force("x", window.d3.forceX(w / 2).strength(0.06));
    sim.force("y", window.d3.forceY(ht / 2).strength(0.08));
    sim.alpha(0.2).restart();
    fit(400);
  }

  function draw() {
    if (!sim) return;
    var vis = visNodes(), ok = new Set(vis.map(function (n) { return n.id; }));
    var links = rawLinks.filter(function (l) { return ok.has(l.s) && ok.has(l.t); }).map(function (l) { return { source: byId.get(l.s), target: byId.get(l.t), w: l.w }; });

    lSel = lLayer.selectAll("line").data(links, function (l) { return l.source.id + ">" + l.target.id; })
      .join("line").attr("stroke-width", function (l) { return l.w > 1 ? 1.6 : 1; });

    nSel = nLayer.selectAll("g.nd").data(vis, function (n) { return n.id; })
      .join(function (enter) {
        var gg = enter.append("g").attr("class", "nd").style("cursor", "pointer");
        gg.append("circle").attr("stroke", "var(--color-bg,#f3f2f2)").attr("stroke-width", 2);
        gg.append("text").attr("text-anchor", "middle").attr("font-family", "Archivo, 'Noto Sans KR', sans-serif")
          .attr("font-weight", 700).attr("paint-order", "stroke").attr("stroke", "var(--color-bg,#f3f2f2)").attr("stroke-width", 3.5).attr("stroke-linejoin", "round");
        gg.call(drag)
          .on("click", function (e, n) { e.stopPropagation(); setState({ selId: n.id }, style); })
          .on("mouseenter", function (e, n) { hover = n.id; style(); })
          .on("mouseleave", function () { hover = null; style(); });
        return gg;
      });

    nSel.select("circle").attr("r", function (n) { return meta(n).r; }).attr("fill", function (n) { return meta(n).color; });
    nSel.select("text").attr("y", function (n) { return meta(n).r + 15; }).attr("font-size", function (n) { return n.type === "school" ? 15 : n.type === "dept" ? 13 : 11; }).text(function (n) { return n.name; });

    sim.nodes(vis);
    sim.force("link").links(links);
    sim.alpha(0.6).restart();
    style();
  }

  function style() {
    if (!nSel) return;
    var sel = state.selId, hov = hover, focus = hov || sel;
    var src = new Set(state.srcIds);
    var near = focus ? new Set([focus].concat(Array.from(adj.get(focus)))) : null;
    var mode = LABEL_MODE;

    nSel.attr("opacity", function (n) { return near ? (near.has(n.id) ? 1 : 0.18) : src.size ? (src.has(n.id) ? 1 : 0.28) : 1; });
    nSel.select("circle")
      .attr("stroke", function (n) { return n.id === sel || src.has(n.id) ? "#201e1d" : "var(--color-bg,#f3f2f2)"; })
      .attr("stroke-width", function (n) { return n.id === sel || src.has(n.id) ? 3 : 2; });
    nSel.select("text").attr("opacity", function (n) { // opacity(=stroke+fill) so 숨긴 라벨의 흰 halo 도 같이 사라짐
      if (mode === "all") return 1;
      if (near && near.has(n.id)) return 1;
      if (src.has(n.id)) return 1;
      if (mode === "hubs") return n.type === "school" || n.type === "dept" ? 1 : 0;
      return n.type === "school" ? 1 : n.type === "dept" ? 0.9 : 0;
    });
    if (lSel) lSel.attr("stroke-opacity", function (l) { return near ? (near.has(l.source.id) && near.has(l.target.id) ? 0.55 : 0.06) : 0.16; });
  }

  // ── QA (DC answer/submit 이식) ────────────────────────────────────
  function answer(q) {
    var words = q.replace(/[?？!.,]/g, " ").split(/\s+/).filter(function (w) { return w.length > 1; });
    var stems = [];
    words.forEach(function (w) {
      var set = [w];
      if (w.length > 2) set.push(w.slice(0, -1));
      if (w.length > 3) set.push(w.slice(0, -2));
      stems.push(set.filter(function (x) { return x.length > 1; }));
    });
    var scored = nodes.filter(function (n) { return n.type !== "school"; }).map(function (n) {
      var hay = n.name + " " + (n.note || ""), s = 0;
      stems.forEach(function (set) { var hit = set.find(function (x) { return hay.includes(x); }); if (hit) s += 2 + hit.length * 0.2; });
      s += adj.get(n.id).size * 0.12;
      return { n: n, s: s };
    }).sort(function (a, b) { return b.s - a.s; });
    var hits = scored.filter(function (x) { return x.s >= 2; });
    var seen = new Set();
    var pick = (hits.length ? hits : scored).map(function (x) { return x.n; })
      .filter(function (n) { return seen.has(n.name) ? false : (seen.add(n.name), true); }).slice(0, 3);
    var names = pick.map(function (n) { return n.name; });
    var rest = names.slice(1);
    var text = hits.length
      ? "『" + names[0] + "』 문서를 기준으로 답변드립니다. " + q.replace(/[?？]$/, "") + "에 대한 내용이 이 노드에 정리되어 있으며, "
        + (rest.length ? "연결된 " + rest.join(", ") + " 노드에서 " : SCHOOL.name + " 학사 규정에서 ")
        + "세부 기준과 기한을 확인할 수 있습니다."
      : "그래프에서 정확히 일치하는 노드를 찾지 못했습니다. 대신 연결이 많은 " + names.join(", ") + " 노드를 살펴보시거나, 학과 · 강의 이름을 포함해 다시 질문해 주세요.";
    return { text: text, ids: pick.map(function (n) { return n.id; }) };
  }

  function submit() {
    var q = (state.q || "").trim();
    if (!q) return;
    setState({ busy: true, ans: null, srcIds: [] }, style);
    clearTimeout(_a);
    _a = setTimeout(function () { var r = answer(q); setState({ busy: false, ans: r.text, srcIds: r.ids }, style); }, 620);
  }

  // ── 렌더링 (DC renderVals + 템플릿 이식) ──────────────────────────
  var kicker = function (label) { return '<span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 58%,transparent);">' + label + '</span>'; };

  function sidebarHTML() {
    var vis = visNodes(), okIds = new Set(vis.map(function (n) { return n.id; }));
    var lVis = rawLinks.filter(function (l) { return okIds.has(l.s) && okIds.has(l.t); }).length;
    var counts = {}; nodes.forEach(function (n) { counts[n.type] = (counts[n.type] || 0) + 1; });

    var stat = function (label, val) { return '<div><div style="font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-bottom:5px;">' + label + '</div><div style="font-weight:800;font-size:22px;line-height:1;">' + val + '</div></div>'; };
    var head = '<div style="padding:26px 24px 20px;border-bottom:2px solid var(--color-divider,#d8d5d4);">'
      + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;"><span style="width:9px;height:9px;background:var(--color-accent,#ec3013);display:block;"></span><span style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 58%,transparent);">ASKU · Graph</span></div>'
      + '<h1 style="margin:0;font-weight:800;letter-spacing:-.02em;line-height:1;font-size:30px;">' + esc(SCHOOL_NAME) + '</h1>'
      + '<div style="margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">' + esc(SCHOOL.en) + '</div>'
      + '<div style="display:flex;gap:26px;margin-top:20px;">' + stat("노드", vis.length) + stat("연결", lVis) + '</div></div>';

    var rows = TYPES.map(function (t) {
      var on = !state.off[t.key];
      return '<div class="qa-type" data-act="type" data-key="' + t.key + '" style="display:flex;align-items:center;gap:12px;padding:9px 8px;margin:0 -8px;cursor:pointer;opacity:' + (on ? 1 : 0.42) + ';transition:opacity .18s ease,background .18s ease;">'
        + '<span style="width:14px;height:14px;flex:0 0 auto;border:2px solid ' + t.color + ';background:' + (on ? t.color : "transparent") + ';"></span>'
        + '<span style="flex:1 1 auto;font-size:14px;font-weight:700;letter-spacing:-.01em;">' + t.label + '</span>'
        + '<span style="font-size:12px;font-weight:700;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">' + (counts[t.key] || 0) + '</span></div>';
    }).join("");
    var types = '<div style="padding:22px 24px 18px;border-bottom:2px solid var(--color-divider,#d8d5d4);">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">' + kicker("노드 타입")
      + '<a href="#" data-act="allOn" style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--color-accent-700,#a52108);">전체 보기</a></div>'
      + '<div style="display:flex;flex-direction:column;gap:2px;">' + rows + '</div></div>';

    var s = state.selId ? byId.get(state.selId) : null, selBody;
    if (s) {
      var m = meta(s);
      var metaTxt = s.note || (TYPES.find(function (t) { return t.key === s.type; }) || {}).meta || SCHOOL.en;
      var nbs = Array.from(adj.get(s.id)).slice(0, 8).map(function (id) { return byId.get(id); });
      selBody = '<div>'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><span style="width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:' + m.color + ';"></span>'
        + '<span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 55%,transparent);">' + esc(m.label) + '</span></div>'
        + '<div style="font-weight:800;font-size:19px;line-height:1.25;letter-spacing:-.01em;margin-bottom:14px;text-wrap:pretty;">' + esc(s.name) + '</div>'
        + '<div style="border-top:2px solid var(--color-divider,#d8d5d4);padding-top:12px;font-size:12px;font-weight:600;line-height:1.6;color:color-mix(in srgb,var(--color-text,#201e1d) 66%,transparent);">' + esc(metaTxt) + '</div>'
        + '<div style="margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-bottom:8px;">연결된 노드 ' + adj.get(s.id).size + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + nbs.map(function (nb) { return '<span class="qa-nb" data-act="node" data-id="' + nb.id + '" style="cursor:pointer;font-size:11px;font-weight:700;padding:5px 8px;border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 18%,transparent);">' + esc(nb.name) + '</span>'; }).join("") + '</div></div>';
    } else {
      selBody = '<div style="font-size:12px;font-weight:600;line-height:1.7;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">그래프의 노드를 클릭하면 상세 정보가 표시됩니다. 드래그로 노드를 옮기고, 휠로 확대·축소할 수 있습니다.</div>';
    }
    var sel = '<div style="padding:22px 24px;flex:1 1 auto;min-height:0;">' + '<div style="margin-bottom:14px;">' + kicker("선택한 노드") + '</div>' + selBody + '</div>';

    return head + types + sel;
  }

  function answerHTML() {
    if (!state.ans) return "";
    var sources = state.srcIds.map(function (id) { var n = byId.get(id); return { id: id, name: n.name, color: meta(n).color }; });
    return '<div style="pointer-events:auto;width:100%;border:2px solid var(--color-text,#201e1d);background:var(--color-surface,#fff);padding:20px 22px;animation:qa-up .3s cubic-bezier(.2,.7,.2,1) both;">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">'
      + '<div style="display:flex;align-items:center;gap:9px;"><span style="width:8px;height:8px;background:var(--color-accent,#ec3013);display:block;"></span><span style="font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 58%,transparent);">ASKU 답변</span></div>'
      + '<span class="qa-x" data-act="clearAns" style="cursor:pointer;font-size:16px;font-weight:700;line-height:1;color:color-mix(in srgb,var(--color-text,#201e1d) 45%,transparent);">✕</span></div>'
      + '<div style="font-size:15px;font-weight:600;line-height:1.65;letter-spacing:-.01em;text-wrap:pretty;">' + esc(state.ans) + '</div>'
      + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:2px solid var(--color-divider,#d8d5d4);">'
      + '<span style="font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-right:4px;">근거 노드</span>'
      + sources.map(function (s) { return '<span class="qa-src" data-act="node" data-id="' + s.id + '" style="cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 10px;border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 18%,transparent);"><span style="width:8px;height:8px;border-radius:50%;background:' + s.color + ';"></span>' + esc(s.name) + '</span>'; }).join("")
      + '</div></div>';
  }

  var input;
  function render() {
    document.getElementById("qa-sbbody").innerHTML = sidebarHTML();
    document.getElementById("qa-answer").innerHTML = answerHTML();
    var open = state.sidebar;
    document.getElementById("qa-aside").style.width = open ? "320px" : "0px";
    var btn = document.querySelector('[data-act="toggleSb"]');
    btn.style.left = open ? "calc(320px + 20px)" : "20px";
    btn.textContent = open ? "‹" : "›";
    input.placeholder = state.busy ? "그래프를 탐색하는 중…" : "학교에 대해 무엇이든 물어보세요";
  }

  // ── 이벤트 위임 ────────────────────────────────────────────────────
  function onAction(el) {
    var act = el.getAttribute("data-act");
    if (act === "toggleSb") { setState({ sidebar: !state.sidebar }); setTimeout(resize, 360); }
    else if (act === "reset") { nodes.forEach(function (n) { n.fx = null; n.fy = null; }); if (sim) sim.alpha(0.9).restart(); setTimeout(function () { fit(500); }, 900); }
    else if (act === "back") { if (window.history.length > 1) window.history.back(); else location.href = "find.html"; }
    else if (act === "ask") { submit(); }
    else if (act === "allOn") { setState({ off: {} }, draw); }
    else if (act === "type") { var key = el.getAttribute("data-key"); var next = {}; for (var k in state.off) next[k] = state.off[k]; next[key] = !state.off[key]; setState({ off: next }, draw); }
    else if (act === "node") { setState({ selId: el.getAttribute("data-id") }, style); }
    else if (act === "clearAns") { setState({ ans: null, srcIds: [] }, style); }
  }

  document.addEventListener("DOMContentLoaded", function () {
    input = document.getElementById("qa-input");

    document.getElementById("qa-chips").innerHTML = CHIPS.map(function (t) {
      return '<span class="qa-chip" data-q="' + esc(t) + '" style="cursor:pointer;font-size:12px;font-weight:700;letter-spacing:-.01em;padding:8px 13px;background:var(--color-surface,#fff);border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 16%,transparent);">' + esc(t) + '</span>';
    }).join("");

    document.getElementById("qa-app").addEventListener("click", function (e) {
      var chip = e.target.closest("[data-q]");
      if (chip) { input.value = chip.getAttribute("data-q"); state.q = input.value; submit(); return; }
      var el = e.target.closest("[data-act]");
      if (!el) return;
      if (el.tagName === "A") e.preventDefault();
      onAction(el);
    });

    input.addEventListener("input", function (e) { state.q = e.target.value; });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

    build();
    render();
    waitD3();
  });

  window.addEventListener("beforeunload", function () { if (_ro) _ro.disconnect(); if (sim) sim.stop(); clearTimeout(_t); clearTimeout(_a); });

  // ponytail: node 자가검증용 훅. 브라우저에선 __QA_TEST__ 가 없어 무시됨.
  if (typeof globalThis !== "undefined" && globalThis.__QA_TEST__) globalThis.__QA__ = { build: build, answer: answer, TYPES: TYPES, get: function () { return { nodes: nodes, adj: adj, byId: byId }; } };
})();
</script>
</body>
</html>
