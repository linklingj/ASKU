<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASKU — 그래프 QA</title>
<!-- SchoolQA.dc.html 을 DC(React) 런타임 없이 이식. 디자인 시스템 토큰(styles.css)·Archivo 계승, 그래프는 d3 로만 구동. -->
<link rel="stylesheet" href="_ds/modernist-c94de0c9-726d-442a-9bb3-d3b24f39b8cb/styles.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="api.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,'Archivo',sans-serif);-webkit-font-smoothing:antialiased;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  input{font-family:inherit;}
  input:focus{outline:none;}
  ::selection{background:color-mix(in srgb,var(--color-accent,#ec3013) 22%,transparent);}
  @keyframes qa-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  /* style-hover 이식: 인라인 base 값을 덮어야 해서 !important */
  .qa-type:hover{background:color-mix(in srgb,var(--color-text,#201e1d) 6%,transparent)!important;}
  .qa-nb:hover,.qa-src:hover,.qa-chip:hover{border-color:var(--color-text,#201e1d)!important;}
  .qa-invert:hover,.qa-sbtoggle:hover{background:var(--color-text,#201e1d)!important;color:var(--color-bg,#f3f2f2)!important;}
  .qa-x:hover{color:var(--color-accent,#ec3013)!important;}
  .qa-ask:hover{background:var(--color-accent,#ec3013)!important;}
  #qa-sbbody::-webkit-scrollbar{width:0;}
  /* 질의 중: 입력창 그라디언트 테두리를 붉게 흐르게 하고, 화살표를 스피너로 교체 */
  .qa-bar{background:linear-gradient(90deg,#3f9be0 0%,#6d5df0 38%,#a63fd0 66%,#ec3197 100%);}
  .qa-bar.busy{background:linear-gradient(90deg,#ff3b1f 0%,#ec3013 40%,#ff5a3c 70%,#c81f0f 100%);background-size:200% 100%;animation:qa-barflow 1.1s linear infinite;}
  @keyframes qa-barflow{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  .qa-spin{display:block;width:20px;height:20px;border:2.5px solid color-mix(in srgb,var(--color-bg,#f3f2f2) 35%,transparent);border-top-color:var(--color-bg,#f3f2f2);border-radius:50%;animation:qa-spin .7s linear infinite;}
  @keyframes qa-spin{to{transform:rotate(360deg);}}

  /* 마크다운 렌더링 스타일 */
  .md-content{font-size:14px;line-height:1.65;color:var(--color-text,#201e1d);word-break:break-word;}
  .md-content h1,.md-content h2,.md-content h3,.md-content h4,.md-content .md-h1,.md-content .md-h2,.md-content .md-h3,.md-content .md-h4{margin:12px 0 6px;font-weight:800;line-height:1.3;letter-spacing:-.01em;}
  .md-content h1,.md-content .md-h1{font-size:1.35em;border-bottom:2px solid var(--color-divider,#d8d5d4);padding-bottom:4px;}
  .md-content h2,.md-content .md-h2{font-size:1.2em;}
  .md-content h3,.md-content .md-h3{font-size:1.1em;}
  .md-content h4,.md-content .md-h4{font-size:1em;}
  .md-content p,.md-content .md-p{margin:6px 0;}
  .md-content strong{font-weight:800;color:var(--color-text,#201e1d);}
  .md-content em{font-style:italic;}
  .md-content ul,.md-content ol,.md-content .md-ul,.md-content .md-ol{margin:6px 0;padding-left:22px;}
  .md-content li{margin:3px 0;}
  .md-content table,.md-content .md-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px;background:var(--color-bg,#f3f2f2);}
  .md-content th,.md-content td{border:1.5px solid color-mix(in srgb,var(--color-text,#201e1d) 20%,transparent);padding:7px 10px;text-align:left;}
  .md-content th{background:color-mix(in srgb,var(--color-text,#201e1d) 8%,transparent);font-weight:800;}
  .md-content blockquote,.md-content .md-bq{border-left:3px solid var(--color-accent,#ec3013);margin:8px 0;padding:4px 0 4px 12px;color:color-mix(in srgb,var(--color-text,#201e1d) 70%,transparent);font-weight:600;}
  .md-content code{font-family:monospace;background:color-mix(in srgb,var(--color-text,#201e1d) 8%,transparent);padding:2px 5px;border-radius:3px;font-size:.9em;}
  .md-content pre,.md-content .md-codeblock{background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2);padding:12px;border-radius:4px;overflow-x:auto;margin:10px 0;}
  .md-content pre code{background:transparent;padding:0;color:inherit;}
  .md-gap{height:8px;}
</style>
</head>
<body>
<div id="qa-app" style="position:relative;height:100vh;width:100%;overflow:hidden;display:flex;">

  <aside id="qa-aside" style="position:relative;z-index:20;flex:0 0 auto;width:320px;overflow:hidden;border-right:2px solid var(--color-divider,#d8d5d4);background:var(--color-bg,#f3f2f2);transition:width .34s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;">
    <div id="qa-sbbody" style="width:318px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:auto;"></div>
  </aside>

  <button data-act="toggleSb" class="qa-sbtoggle" style="position:absolute;top:26px;left:calc(320px + 20px);z-index:40;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid var(--color-text,#201e1d);background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);cursor:pointer;font-size:15px;font-weight:800;line-height:1;transition:left .34s cubic-bezier(.2,.7,.2,1),background .18s ease,color .18s ease;padding:0;">‹</button>

  <main style="position:relative;flex:1 1 auto;min-width:0;">
    <div id="qa-graph" style="position:absolute;inset:0;"></div>

    <div style="position:absolute;top:26px;right:28px;z-index:15;display:flex;align-items:center;gap:14px;">
      <span style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 45%,transparent);">드래그 · 휠 확대</span>
      <button data-act="reset" class="qa-invert" style="border:2px solid var(--color-text,#201e1d);background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.04em;padding:9px 14px;cursor:pointer;transition:background .18s ease,color .18s ease;">레이아웃 초기화</button>
      <a href="find.html" data-act="back" class="qa-invert" style="display:inline-flex;align-items:center;gap:8px;border:2px solid var(--color-text,#201e1d);background:var(--color-bg,#f3f2f2);font-weight:700;font-size:12px;letter-spacing:.04em;padding:9px 14px;transition:background .18s ease,color .18s ease;">← 학교 변경</a>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;z-index:25;padding:0 28px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--color-bg,#f3f2f2) 92%,transparent) 46%);">

      <div id="qa-answer" style="width:100%;max-width:820px;display:flex;justify-content:center;"></div>

      <div id="qa-chips" style="pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;"></div>

      <div id="qa-bar" class="qa-bar" style="pointer-events:auto;width:100%;max-width:820px;padding:2.5px;border-radius:44px;box-shadow:0 10px 30px color-mix(in srgb,var(--color-text,#201e1d) 12%,transparent);">
        <div style="display:flex;align-items:center;gap:0;background:var(--color-surface,#fff);border-radius:42px;padding:0 10px 0 22px;height:66px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:0 0 auto;color:var(--color-text,#201e1d);"><circle cx="11" cy="11" r="7"></circle><line x1="16.2" y1="16.2" x2="21" y2="21"></line></svg>
          <span style="width:1px;height:30px;background:color-mix(in srgb,var(--color-text,#201e1d) 20%,transparent);margin:0 18px 0 16px;flex:0 0 auto;"></span>
          <input id="qa-input" placeholder="학교에 대해 무엇이든 물어보세요" style="flex:1 1 auto;min-width:0;border:0;background:transparent;font-size:19px;font-weight:500;letter-spacing:-.01em;color:var(--color-text,#201e1d);padding:0;height:100%;">
          <button data-act="ask" class="qa-ask" style="flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2);cursor:pointer;font-size:19px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .18s ease;">↑</button>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
(function () {
  "use strict";
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  // 백엔드 엔티티 타입은 임의의 한글 문자열이라 색을 순번으로 배정한다(등장 빈도 높은 타입에 강한 색부터).
  var PALETTE = ["#ec3013", "#1f6f8b", "#c98b00", "#9b2f6e", "#3f7a3f", "#5a4fcf", "#b5532a", "#2f8f8f", "#8a2be2", "#6b6764"];
  var CHIPS = ["졸업요건이 어떻게 되나요?", "수강신청 일정 알려줘", "장학금 신청 방법"];

  // ── 순수: 백엔드 그래프 payload → d3 구조 ──────────────────────────
  function parseEid(id) { return parseInt(String(id).replace(/^e_/, ""), 10); }
  function nodeRadius(n) { return Math.max(6, Math.min(18, 7 + (n.degree || 0) * 1.1)); }
  function assignTypeColors(list) {
    var counts = {}; list.forEach(function (n) { counts[n.type] = (counts[n.type] || 0) + 1; });
    var types = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || (a < b ? -1 : 1); });
    var color = {}; types.forEach(function (t, i) { color[t] = PALETTE[i % PALETTE.length]; });
    return { color: color, counts: counts, types: types };
  }
  function buildGraph(payload) {
    var N = (payload.nodes || []).map(function (n) { return { id: n.id, name: n.name, type: n.type, degree: n.degree || 0, doc_count: n.doc_count || 0 }; });
    var byId = new Map(N.map(function (n) { return [n.id, n]; }));
    var L = (payload.edges || []).filter(function (e) { return byId.has(e.source) && byId.has(e.target); })
      .map(function (e) { return { s: e.source, t: e.target, relation: e.relation, w: 1 }; });
    var adj = new Map(N.map(function (n) { return [n.id, new Set()]; }));
    L.forEach(function (l) { adj.get(l.s).add(l.t); adj.get(l.t).add(l.s); });
    return { nodes: N, rawLinks: L, byId: byId, adj: adj };
  }

  // ── 마크다운 렌더러 & 답변 파서 ──────────────────────────────────
  function simpleInlineMarkdown(txt) {
    var s = esc(txt);
    s = s.replace(/(\*\*|__)(.*?)\1/g, '<strong>$2</strong>');
    s = s.replace(/(\*|_)(.*?)\1/g, '<em>$2</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  }

  function simpleMarkdown(src) {
    if (!src) return "";
    var s = String(src).replace(/\r\n/g, "\n") + "\n";

    s = s.replace(/```([\s\S]*?)```/g, function (_, code) {
      return '<pre class="md-codeblock"><code>' + esc(code.trim()) + '</code></pre>\n';
    });

    s = s.replace(/(?:(?:\|[^\n]+\|\s*\n)+)/g, function (tableBlock) {
      var lines = tableBlock.trim().split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
      if (lines.length < 2) return tableBlock;

      var html = '<table class="md-table"><thead>';
      var headerRow = lines[0].replace(/^\||\|$/g, '').split('|');
      html += '<tr>' + headerRow.map(function (c) { return '<th>' + simpleInlineMarkdown(c.trim()) + '</th>'; }).join('') + '</tr></thead><tbody>';

      var startIdx = 1;
      if (lines[1] && /^\|?\s*:?-+:?\s*(\||\s*:?-+:?\s*)+$/.test(lines[1])) {
        startIdx = 2;
      }

      for (var i = startIdx; i < lines.length; i++) {
        var row = lines[i].replace(/^\||\|$/g, '').split('|');
        html += '<tr>' + row.map(function (c) { return '<td>' + simpleInlineMarkdown(c.trim()) + '</td>'; }).join('') + '</tr>';
      }
      html += '</tbody></table>\n';
      return html;
    });

    var lines = s.split("\n");
    var out = [];
    var inList = false;
    var listType = 'ul';

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();

      if (/^<(table|pre)/.test(trimmed)) {
        if (inList) { out.push('</' + listType + '>'); inList = false; }
        out.push(trimmed);
        continue;
      }

      var headMatch = trimmed.match(/^(#{1,4})\s+(.*)$/);
      if (headMatch) {
        if (inList) { out.push('</' + listType + '>'); inList = false; }
        var level = headMatch[1].length;
        out.push('<h' + (level + 1) + ' class="md-h' + level + '">' + simpleInlineMarkdown(headMatch[2]) + '</h' + (level + 1) + '>');
        continue;
      }

      var ulMatch = trimmed.match(/^[-*+]\s+(.*)$/);
      if (ulMatch) {
        if (!inList || listType !== 'ul') {
          if (inList) out.push('</' + listType + '>');
          out.push('<ul class="md-ul">');
          inList = true;
          listType = 'ul';
        }
        out.push('<li>' + simpleInlineMarkdown(ulMatch[1]) + '</li>');
        continue;
      }

      var olMatch = trimmed.match(/^\d+\.\s+(.*)$/);
      if (olMatch) {
        if (!inList || listType !== 'ol') {
          if (inList) out.push('</' + listType + '>');
          out.push('<ol class="md-ol">');
          inList = true;
          listType = 'ol';
        }
        out.push('<li>' + simpleInlineMarkdown(olMatch[1]) + '</li>');
        continue;
      }

      var bqMatch = trimmed.match(/^>\s+(.*)$/);
      if (bqMatch) {
        if (inList) { out.push('</' + listType + '>'); inList = false; }
        out.push('<blockquote class="md-bq">' + simpleInlineMarkdown(bqMatch[1]) + '</blockquote>');
        continue;
      }

      if (inList && trimmed === '') {
        out.push('</' + listType + '>');
        inList = false;
        continue;
      }

      if (trimmed === '') {
        out.push('<div class="md-gap"></div>');
      } else {
        if (inList) { out.push('</' + listType + '>'); inList = false; }
        out.push('<p class="md-p">' + simpleInlineMarkdown(line) + '</p>');
      }
    }
    if (inList) out.push('</' + listType + '>');

    return out.join("");
  }

  function renderMarkdown(text) {
    if (!text) return "";
    if (typeof window !== "undefined" && window.marked && typeof window.marked.parse === "function") {
      try {
        return window.marked.parse(text);
      } catch (e) {
        return simpleMarkdown(text);
      }
    }
    return simpleMarkdown(text);
  }

  function parseAnswer(ans) {
    if (!ans) return { summary: "", detail: "" };
    var notFound = /정보를 찾지 못했|찾을 수 없|정보가 없/.test(ans);
    if (notFound) {
      return { summary: ans.trim(), detail: "" };
    }

    var coreMatch = ans.match(/\[핵심\s*답변\]([\s\S]*?)(?=\[상세\s*답변\]|$)/i);
    var detailMatch = ans.match(/\[상세\s*답변\]([\s\S]*)/i);

    if (coreMatch && detailMatch) {
      return {
        summary: coreMatch[1].trim(),
        detail: detailMatch[1].trim()
      };
    } else if (coreMatch) {
      return {
        summary: coreMatch[1].trim(),
        detail: ""
      };
    } else if (detailMatch) {
      return {
        summary: "",
        detail: detailMatch[1].trim()
      };
    }

    var trimmed = ans.trim();
    var parts = trimmed.split(/\n\n+/);
    if (parts.length > 1) {
      return {
        summary: parts[0].trim(),
        detail: parts.slice(1).join("\n\n").trim()
      };
    }
    return {
      summary: trimmed,
      detail: ""
    };
  }

  // 테스트 훅: 브라우저 없이 순수 변환을 검증 (qa.selfcheck.js). DOM/d3 배선은 건너뛴다.
  if (typeof globalThis !== "undefined" && globalThis.__QA_TEST__) {
    globalThis.__QA__ = { parseEid: parseEid, nodeRadius: nodeRadius, assignTypeColors: assignTypeColors, buildGraph: buildGraph, parseAnswer: parseAnswer, renderMarkdown: renderMarkdown, simpleMarkdown: simpleMarkdown };
    return;
  }

  var SCHOOL_ID = new URLSearchParams(location.search).get("school");

  var state = {
    sidebar: true, off: {}, selId: null, q: "", busy: false,
    ans: null, ansSources: [], srcIds: [],
    school: null, statusStage: null, notReadyMsg: "",
    detail: null, detailLoading: false, graphErr: null
  };
  var nodes = [], rawLinks = [], byId = new Map(), adj = new Map();
  var typeInfo = { color: {}, counts: {}, types: [] };
  var detailCache = {};
  var svg, gLayer, lLayer, nLayer, zoom, sim, drag, lSel, nSel, hover = null;
  var _ro, _rf, _t;

  // 라벨은 zoom 그룹과 함께 확대돼 확대 시 과하게 커진다. 화면상 최대 픽셀을 고정해 상한을 둔다.
  var MAX_LABEL_PX = 14, curK = 1;
  function labelSize(n) { return Math.min((n.degree || 0) >= 4 ? 13 : 11, MAX_LABEL_PX / curK); }

  var host = function () { return document.getElementById("qa-graph"); };
  function schoolName() { return (state.school && state.school.name) || ("학교 #" + SCHOOL_ID); }

  function setState(patch, cb) { for (var k in patch) state[k] = patch[k]; render(); if (cb) cb(); }
  function meta(n) { return { color: typeInfo.color[n.type] || "#201e1d", label: n.type || "엔티티", r: nodeRadius(n) }; }
  function visNodes() { return nodes.filter(function (n) { return !state.off[n.type]; }); }

  // ── d3 그래프 ─────────────────────────────────────────────────────
  function waitD3() {
    var h = host();
    if (window.d3 && h && h.clientWidth) {
      init();
      _ro = new ResizeObserver(function () { cancelAnimationFrame(_rf); _rf = requestAnimationFrame(resize); });
      _ro.observe(h);
      return;
    }
    _t = setTimeout(waitD3, 60);
  }

  function init() {
    var d3 = window.d3, h = host();
    if (!h) return;
    var w = h.clientWidth || 900, ht = h.clientHeight || 700;
    svg = d3.select(h).append("svg").attr("width", "100%").attr("height", "100%").style("display", "block").style("cursor", "grab");
    gLayer = svg.append("g");
    lLayer = gLayer.append("g").attr("stroke", "#201e1d");
    nLayer = gLayer.append("g");

    zoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", function (e) { gLayer.attr("transform", e.transform); curK = e.transform.k; if (nSel) nSel.select("text").attr("font-size", labelSize); });
    svg.call(zoom).on("dblclick.zoom", null);
    svg.on("click", function (e) { if (e.target.tagName === "svg") setState({ selId: null, detail: null }); });

    nodes.forEach(function (n) { n.x = w / 2 + (Math.random() - 0.5) * 260; n.y = ht / 2 + (Math.random() - 0.5) * 260; });

    sim = d3.forceSimulation()
      .force("link", d3.forceLink().id(function (x) { return x.id; }).distance(function (l) { return 46 + 20 / (l.w || 1); }).strength(0.32))
      .force("charge", d3.forceManyBody().strength(function (n) { return -110 - (n.degree || 0) * 14; }).distanceMax(420))
      .force("x", d3.forceX(w / 2).strength(0.06))
      .force("y", d3.forceY(ht / 2).strength(0.08))
      .force("collide", d3.forceCollide(function (n) { return meta(n).r + 11; }))
      .on("tick", tick)
      .on("end", function () { fit(500); });

    drag = d3.drag()
      .on("start", function (e, n) { if (!e.active) sim.alphaTarget(0.22).restart(); n.fx = n.x; n.fy = n.y; })
      .on("drag", function (e, n) { n.fx = e.x; n.fy = e.y; })
      .on("end", function (e, n) { if (!e.active) sim.alphaTarget(0); n.fx = null; n.fy = null; });

    draw();
    setTimeout(function () { fit(500); }, 1100);
  }

  function fit(ms) {
    var h = host(), d3 = window.d3;
    if (!h || !svg || !sim) return;
    var ns = sim.nodes(); if (!ns.length) return;
    var w = h.clientWidth, ht = h.clientHeight, pad = 64;
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ns.forEach(function (n) { var r = meta(n).r + 22; x0 = Math.min(x0, n.x - r); x1 = Math.max(x1, n.x + r); y0 = Math.min(y0, n.y - r); y1 = Math.max(y1, n.y + r); });
    var bw = x1 - x0, bh = y1 - y0; if (!bw || !bh) return;
    var k = Math.max(0.3, Math.min(1.6, Math.min((w - pad * 2) / bw, (ht - pad * 2 - 90) / bh)));
    var t = d3.zoomIdentity.translate(w / 2 - k * (x0 + x1) / 2, (ht - 70) / 2 - k * (y0 + y1) / 2).scale(k);
    svg.transition().duration(ms || 0).call(zoom.transform, t);
  }

  function tick() {
    if (lSel) lSel.attr("x1", function (l) { return l.source.x; }).attr("y1", function (l) { return l.source.y; }).attr("x2", function (l) { return l.target.x; }).attr("y2", function (l) { return l.target.y; });
    if (nSel) nSel.attr("transform", function (n) { return "translate(" + n.x + "," + n.y + ")"; });
  }

  function resize() {
    var h = host(); if (!h || !sim) return;
    var w = h.clientWidth, ht = h.clientHeight;
    sim.force("x", window.d3.forceX(w / 2).strength(0.06));
    sim.force("y", window.d3.forceY(ht / 2).strength(0.08));
    sim.alpha(0.2).restart();
    fit(400);
  }

  function draw() {
    if (!sim) return;
    var vis = visNodes(), ok = new Set(vis.map(function (n) { return n.id; }));
    var links = rawLinks.filter(function (l) { return ok.has(l.s) && ok.has(l.t); }).map(function (l) { return { source: byId.get(l.s), target: byId.get(l.t), w: l.w, relation: l.relation }; });

    lSel = lLayer.selectAll("line").data(links, function (l) { return l.source.id + ">" + l.target.id; })
      .join("line").attr("stroke-width", 1.2);

    nSel = nLayer.selectAll("g.nd").data(vis, function (n) { return n.id; })
      .join(function (enter) {
        var gg = enter.append("g").attr("class", "nd").style("cursor", "pointer");
        gg.append("circle").attr("stroke", "var(--color-bg,#f3f2f2)").attr("stroke-width", 2);
        gg.append("text").attr("text-anchor", "middle").attr("font-family", "Archivo, 'Noto Sans KR', sans-serif")
          .attr("font-weight", 700).attr("paint-order", "stroke").attr("stroke", "var(--color-bg,#f3f2f2)").attr("stroke-width", 3.5).attr("stroke-linejoin", "round");
        gg.call(drag)
          .on("click", function (e, n) { e.stopPropagation(); selectNode(n.id); })
          .on("mouseenter", function (e, n) { hover = n.id; style(); })
          .on("mouseleave", function () { hover = null; style(); });
        return gg;
      });

    nSel.select("circle").attr("r", function (n) { return meta(n).r; }).attr("fill", function (n) { return meta(n).color; });
    nSel.select("text").attr("y", function (n) { return meta(n).r + 15; }).attr("font-size", labelSize).text(function (n) { return n.name; });

    sim.nodes(vis);
    sim.force("link").links(links);
    sim.alpha(0.6).restart();
    style();
  }

  function style() {
    if (!nSel) return;
    var sel = state.selId, hov = hover, focus = hov || sel;
    var src = new Set(state.srcIds);
    var near = focus && adj.has(focus) ? new Set([focus].concat(Array.from(adj.get(focus)))) : null;

    nSel.attr("opacity", function (n) { return near ? (near.has(n.id) ? 1 : 0.18) : src.size ? (src.has(n.id) ? 1 : 0.28) : 1; });
    nSel.select("circle")
      .attr("stroke", function (n) { return n.id === sel || src.has(n.id) ? "#201e1d" : "var(--color-bg,#f3f2f2)"; })
      .attr("stroke-width", function (n) { return n.id === sel || src.has(n.id) ? 3 : 2; });
    nSel.select("text").attr("opacity", function (n) { // opacity(=stroke+fill) so 숨긴 라벨의 흰 halo 도 같이 사라짐
      if (near && near.has(n.id)) return 1;
      if (src.has(n.id)) return 1;
      return (n.degree || 0) >= 4 ? 0.9 : 0; // 허브만 상시 라벨
    });
    if (lSel) lSel.attr("stroke-opacity", function (l) { return near ? (near.has(l.source.id) && near.has(l.target.id) ? 0.55 : 0.06) : 0.16; });
  }

  // ── 노드 선택 → 엔티티 상세 조회 ──────────────────────────────────
  function selectNode(id) {
    setState({ selId: id }, style);
    var cached = detailCache[id];
    if (cached) { setState({ detail: cached, detailLoading: false }); return; }
    setState({ detail: null, detailLoading: true });
    ASKU.get("/schools/" + SCHOOL_ID + "/entities/" + parseEid(id))
      .then(function (d) { detailCache[id] = d; if (state.selId === id) setState({ detail: d, detailLoading: false }); })
      .catch(function (err) { if (state.selId === id) setState({ detail: { _error: err.message }, detailLoading: false }); });
  }

  // ── 질의 → POST /query ────────────────────────────────────────────
  function submit() {
    var q = (state.q || "").trim();
    if (!q || state.busy) return;
    setState({ busy: true, ans: null, ansSources: [], srcIds: [] }, style);
    ASKU.post("/schools/" + SCHOOL_ID + "/query", { question: q })
      .then(function (r) {
        var ids = (r.entity_ids || []).filter(function (id) { return byId.has(id); });
        setState({ busy: false, ans: r.answer, ansSources: r.sources || [], srcIds: ids }, style);
      })
      .catch(function (err) {
        setState({ busy: false, ans: err.message || "답변을 가져오지 못했습니다.", ansSources: [], srcIds: [] }, style);
      });
  }

  // ── 렌더링 ────────────────────────────────────────────────────────
  var kicker = function (label) { return '<span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 58%,transparent);">' + label + '</span>'; };

  function detailHTML(d) {
    var m = { color: typeInfo.color[d.type] || "#201e1d", label: d.type || "엔티티" };
    var out = '<div>'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><span style="width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:' + m.color + ';"></span>'
      + '<span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 55%,transparent);">' + esc(m.label) + '</span></div>'
      + '<div style="font-weight:800;font-size:19px;line-height:1.25;letter-spacing:-.01em;margin-bottom:14px;text-wrap:pretty;">' + esc(d.name) + '</div>';

    var attrs = d.attributes || {};
    var keys = Object.keys(attrs);
    if (keys.length) {
      out += '<div style="border-top:2px solid var(--color-divider,#d8d5d4);padding-top:12px;display:flex;flex-direction:column;gap:7px;">'
        + keys.map(function (k) { return '<div style="display:flex;gap:10px;font-size:12px;line-height:1.5;"><span style="flex:0 0 88px;font-weight:700;color:color-mix(in srgb,var(--color-text,#201e1d) 55%,transparent);">' + esc(k) + '</span><span style="flex:1 1 auto;font-weight:600;">' + esc(typeof attrs[k] === "object" ? JSON.stringify(attrs[k]) : attrs[k]) + '</span></div>'; }).join("")
        + '</div>';
    }

    var sources = d.sources || [];
    if (sources.length) {
      out += '<div style="margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-bottom:8px;">근거 문서 ' + sources.length + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:6px;">' + sources.map(function (s) {
          return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" class="qa-src" style="display:block;font-size:12px;font-weight:700;line-height:1.4;padding:8px 10px;border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 18%,transparent);text-wrap:pretty;">' + esc(s.title || s.url) + ' ↗</a>';
        }).join("") + '</div>';
    }

    var nbs = d.neighbors || [];
    if (nbs.length) {
      out += '<div style="margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-bottom:8px;">연결된 노드 ' + nbs.length + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + nbs.map(function (nb) {
          return '<span class="qa-nb" data-act="node" data-id="' + esc(nb.id) + '" style="cursor:pointer;font-size:11px;font-weight:700;padding:5px 8px;border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 18%,transparent);" title="' + esc(nb.relation || "") + '">' + esc(nb.name) + '</span>';
        }).join("") + '</div>';
    }
    return out + '</div>';
  }

  function sidebarHTML() {
    var vis = visNodes(), okIds = new Set(vis.map(function (n) { return n.id; }));
    var lVis = rawLinks.filter(function (l) { return okIds.has(l.s) && okIds.has(l.t); }).length;

    var stat = function (label, val) { return '<div><div style="font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-bottom:5px;">' + label + '</div><div style="font-weight:800;font-size:22px;line-height:1;">' + val + '</div></div>'; };
    var statusLine = state.statusStage ? '<div style="margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">' + esc(state.statusStage) + '</div>' : "";
    var head = '<div style="padding:26px 24px 20px;border-bottom:2px solid var(--color-divider,#d8d5d4);">'
      + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;"><span style="width:9px;height:9px;background:var(--color-accent,#ec3013);display:block;"></span><span style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 58%,transparent);">ASKU · Graph</span></div>'
      + '<h1 style="margin:0;font-weight:800;letter-spacing:-.02em;line-height:1;font-size:30px;">' + esc(schoolName()) + '</h1>'
      + statusLine
      + '<div style="display:flex;gap:26px;margin-top:20px;">' + stat("노드", vis.length) + stat("연결", lVis) + '</div></div>';

    var rows = typeInfo.types.map(function (t) {
      var on = !state.off[t];
      var color = typeInfo.color[t];
      return '<div class="qa-type" data-act="type" data-key="' + esc(t) + '" style="display:flex;align-items:center;gap:12px;padding:9px 8px;margin:0 -8px;cursor:pointer;opacity:' + (on ? 1 : 0.42) + ';transition:opacity .18s ease,background .18s ease;">'
        + '<span style="width:14px;height:14px;flex:0 0 auto;border:2px solid ' + color + ';background:' + (on ? color : "transparent") + ';"></span>'
        + '<span style="flex:1 1 auto;font-size:14px;font-weight:700;letter-spacing:-.01em;">' + esc(t) + '</span>'
        + '<span style="font-size:12px;font-weight:700;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">' + (typeInfo.counts[t] || 0) + '</span></div>';
    }).join("");
    var types = typeInfo.types.length ? ('<div style="padding:22px 24px 18px;border-bottom:2px solid var(--color-divider,#d8d5d4);">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">' + kicker("노드 타입")
      + '<a href="#" data-act="allOn" style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--color-accent-700,#a52108);">전체 보기</a></div>'
      + '<div style="display:flex;flex-direction:column;gap:2px;">' + rows + '</div></div>') : "";

    var selBody;
    if (state.detailLoading) selBody = '<div style="font-size:12px;font-weight:600;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">불러오는 중…</div>';
    else if (state.detail && state.detail._error) selBody = '<div style="font-size:12px;font-weight:600;line-height:1.7;color:var(--color-accent,#ec3013);">' + esc(state.detail._error) + '</div>';
    else if (state.detail) selBody = detailHTML(state.detail);
    else selBody = '<div style="font-size:12px;font-weight:600;line-height:1.7;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);">그래프의 노드를 클릭하면 상세 정보가 표시됩니다. 드래그로 노드를 옮기고, 휠로 확대·축소할 수 있습니다.</div>';
    var sel = '<div style="padding:22px 24px;flex:1 1 auto;min-height:0;">' + '<div style="margin-bottom:14px;">' + kicker("선택한 노드") + '</div>' + selBody + '</div>';

    return head + types + sel;
  }

  function answerHTML() {
    // 준비되지 않은 학교면 상태 배너를 답변 슬롯에 노출(숨기지 않는다).
    if (!state.ans && state.notReadyMsg) {
      return '<div style="pointer-events:auto;width:100%;border:2px solid var(--color-text,#201e1d);background:var(--color-surface,#fff);padding:16px 20px;font-size:13px;font-weight:600;line-height:1.6;">' + esc(state.notReadyMsg) + '</div>';
    }
    if (!state.ans) return "";

    var parsed = parseAnswer(state.ans);
    var notFound = /정보를 찾지 못했|찾을 수 없|정보가 없/.test(state.ans);
    var srcHTML = notFound ? "" : (state.ansSources || []).map(function (s) {
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" class="qa-src" style="display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 10px;border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 18%,transparent);text-wrap:pretty;">' + esc(s.title || s.url) + ' ↗</a>';
    }).join("");

    var srcRow = srcHTML
      ? '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:2px solid var(--color-divider,#d8d5d4);">'
        + '<span style="font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 50%,transparent);margin-right:4px;">근거 문서</span>' + srcHTML + '</div>'
      : "";

    var summarySection = parsed.summary
      ? '<div class="qa-ans-card qa-ans-summary" style="padding:14px 16px;background:color-mix(in srgb,var(--color-accent,#ec3013) 6%,transparent);border-left:4px solid var(--color-accent,#ec3013);margin-bottom:12px;border-radius:2px;">'
        + '<div style="font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent,#ec3013);margin-bottom:6px;">핵심 답변</div>'
        + '<div class="md-content" style="font-size:15px;font-weight:700;line-height:1.6;letter-spacing:-.01em;">' + renderMarkdown(parsed.summary) + '</div>'
        + '</div>'
      : "";

    var detailSection = parsed.detail
      ? '<div class="qa-ans-card qa-ans-detail" style="margin-bottom:12px;padding:12px 14px;border:1.5px solid color-mix(in srgb,var(--color-text,#201e1d) 15%,transparent);background:color-mix(in srgb,var(--color-bg,#f3f2f2) 40%,transparent);border-radius:4px;">'
        + '<div style="font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 60%,transparent);margin-bottom:8px;">상세 답변</div>'
        + '<div class="md-content">' + renderMarkdown(parsed.detail) + '</div>'
        + '</div>'
      : "";

    return '<div style="pointer-events:auto;width:100%;max-height:75vh;overflow-y:auto;border:2px solid var(--color-text,#201e1d);background:var(--color-surface,#fff);padding:20px 22px;animation:qa-up .3s cubic-bezier(.2,.7,.2,1) both;">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
      + '<div style="display:flex;align-items:center;gap:9px;"><span style="width:8px;height:8px;background:var(--color-accent,#ec3013);display:block;"></span><span style="font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text,#201e1d) 58%,transparent);">ASKU 답변</span></div>'
      + '<span class="qa-x" data-act="clearAns" style="cursor:pointer;font-size:16px;font-weight:700;line-height:1;color:color-mix(in srgb,var(--color-text,#201e1d) 45%,transparent);">✕</span></div>'
      + summarySection
      + detailSection
      + srcRow + '</div>';
  }

  var input;
  function render() {
    document.getElementById("qa-sbbody").innerHTML = sidebarHTML();
    document.getElementById("qa-answer").innerHTML = answerHTML();
    var open = state.sidebar;
    document.getElementById("qa-aside").style.width = open ? "320px" : "0px";
    var btn = document.querySelector('[data-act="toggleSb"]');
    btn.style.left = open ? "calc(320px + 20px)" : "20px";
    btn.textContent = open ? "‹" : "›";
    if (input) input.placeholder = state.busy ? "답변을 생성하는 중…" : "학교에 대해 무엇이든 물어보세요";
    var bar = document.getElementById("qa-bar");
    if (bar) bar.classList.toggle("busy", !!state.busy);
    var ask = document.querySelector('[data-act="ask"]');
    if (ask) ask.innerHTML = state.busy ? '<span class="qa-spin"></span>' : "↑";
  }

  // 그래프 데이터가 없을 때 호스트에 안내를 표시(숨기지 않는다).
  function showGraphMessage(msg) {
    var h = host(); if (!h) return;
    h.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;">'
      + '<div style="max-width:34ch;font-size:14px;font-weight:600;line-height:1.7;color:color-mix(in srgb,var(--color-text,#201e1d) 55%,transparent);">' + esc(msg) + '</div></div>';
  }

  // ── 이벤트 위임 ────────────────────────────────────────────────────
  function onAction(el) {
    var act = el.getAttribute("data-act");
    if (act === "toggleSb") { setState({ sidebar: !state.sidebar }); setTimeout(resize, 360); }
    else if (act === "reset") { nodes.forEach(function (n) { n.fx = null; n.fy = null; }); if (sim) sim.alpha(0.9).restart(); setTimeout(function () { fit(500); }, 900); }
    else if (act === "back") { if (window.history.length > 1) window.history.back(); else location.href = "find.html"; }
    else if (act === "ask") { submit(); }
    else if (act === "allOn") { setState({ off: {} }, draw); }
    else if (act === "type") { var key = el.getAttribute("data-key"); var next = {}; for (var k in state.off) next[k] = state.off[k]; next[key] = !state.off[key]; setState({ off: next }, draw); }
    else if (act === "node") { selectNode(el.getAttribute("data-id")); }
    else if (act === "clearAns") { setState({ ans: null, ansSources: [], srcIds: [] }, style); }
  }

  // ── 데이터 로드: 학교 헤더 + 그래프 ───────────────────────────────
  function loadData() {
    if (!SCHOOL_ID || isNaN(parseInt(SCHOOL_ID, 10))) {
      showGraphMessage("학교가 지정되지 않았습니다. ‘학교 변경’에서 학교를 선택해 주세요.");
      return;
    }
    ASKU.get("/schools/" + SCHOOL_ID)
      .then(function (school) {
        var ready = school.status === "ready" || school.status === "partial_failed";
        setState({
          school: school,
          statusStage: ready ? null : school.status,
          notReadyMsg: ready ? "" : "이 학교는 아직 인덱싱 중입니다 (" + school.status + "). 완료 후 질문할 수 있습니다."
        });
      })
      .catch(function (err) { setState({ notReadyMsg: "학교 정보를 불러오지 못했습니다: " + (err.message || "") }); });

    ASKU.get("/schools/" + SCHOOL_ID + "/graph")
      .then(function (payload) {
        var g = buildGraph(payload);
        nodes = g.nodes; rawLinks = g.rawLinks; byId = g.byId; adj = g.adj;
        typeInfo = assignTypeColors(nodes);
        render();
        if (!nodes.length) { showGraphMessage("아직 표시할 그래프가 없습니다. 크롤링·인덱싱이 끝나면 노드가 채워집니다."); return; }
        waitD3();
      })
      .catch(function (err) { showGraphMessage("그래프를 불러오지 못했습니다: " + (err.message || "")); });
  }

  document.addEventListener("DOMContentLoaded", function () {
    input = document.getElementById("qa-input");

    document.getElementById("qa-chips").innerHTML = CHIPS.map(function (t) {
      return '<span class="qa-chip" data-q="' + esc(t) + '" style="cursor:pointer;font-size:12px;font-weight:700;letter-spacing:-.01em;padding:8px 13px;background:var(--color-surface,#fff);border:2px solid color-mix(in srgb,var(--color-text,#201e1d) 16%,transparent);">' + esc(t) + '</span>';
    }).join("");

    document.getElementById("qa-app").addEventListener("click", function (e) {
      var chip = e.target.closest("[data-q]");
      if (chip) { input.value = chip.getAttribute("data-q"); state.q = input.value; submit(); return; }
      var el = e.target.closest("[data-act]");
      if (!el) return; // 근거 문서 링크(qa-src)는 data-act 가 없어 브라우저가 새 탭으로 연다
      if (el.tagName === "A") e.preventDefault();
      onAction(el);
    });

    input.addEventListener("input", function (e) { state.q = e.target.value; });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

    render();
    loadData();
  });

  window.addEventListener("beforeunload", function () { if (_ro) _ro.disconnect(); if (sim) sim.stop(); clearTimeout(_t); });
})();
</script>
</body>
</html>
