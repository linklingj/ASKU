<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASKU — 관리자</title>
<link rel="icon" type="image/svg+xml" href="assets/logo_A.svg">
<link rel="stylesheet" href="_ds/modernist-c94de0c9-726d-442a-9bb3-d3b24f39b8cb/styles.css">
<script src="api.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,Arial,sans-serif)}
button,input{font:inherit} button{cursor:pointer}.wrap{width:min(900px,calc(100% - 44px));margin:0 auto;padding:48px 0 80px}.top{display:flex;justify-content:space-between;align-items:start;gap:20px;border-bottom:3px solid currentColor;padding-bottom:28px}.k{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--color-accent,#ec3013)}h1{font-size:clamp(36px,6vw,64px);line-height:.9;letter-spacing:-.04em;margin:10px 0 0}.button{border:2px solid currentColor;background:transparent;padding:10px 14px;font-weight:800}.button.primary{background:var(--color-accent,#ec3013);border-color:var(--color-accent,#ec3013);color:#fff}.panel{margin-top:32px;padding:24px;border:2px solid color-mix(in srgb,currentColor 18%,transparent);background:var(--color-surface,#fff)}label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;margin:15px 0 6px}input{width:100%;border:2px solid currentColor;padding:11px;background:transparent}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.school{padding:20px 0;border-bottom:1px solid color-mix(in srgb,currentColor 20%,transparent)}.school:last-child{border:0}.schoolhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.school img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid currentColor}.msg{margin-top:15px;font-weight:700;line-height:1.5}.bad{color:#b42318}.hidden{display:none}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="k">ASKU · ADMIN</div><h1>학교 관리</h1></div><a class="button btn-ink" href="index.html">← 홈</a></div>
<section id="login" class="panel"><div class="k">인증 필요</div><h2>관리자 로그인</h2><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password"><div class="row" style="margin-top:16px"><button id="loginBtn" class="button primary btn-accent">로그인</button></div><div id="loginMsg" class="msg" aria-live="polite"></div></section>
<section id="manage" class="hidden"><div class="row" style="margin-top:28px;justify-content:space-between"><p style="margin:0;font-weight:700">대표 이미지 URL을 비우면 기본 표시로 돌아갑니다.</p><button id="logoutBtn" class="button btn-ink">로그아웃</button></div><div id="schools" class="panel"></div></section>
</main>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id)}, login=$('login'),manage=$('manage'), list=$('schools');
function msg(el,text,bad){el.textContent=text;el.className='msg'+(bad?' bad':'')}
function authenticated(){try{return !!sessionStorage.getItem('asku_admin_token')}catch(_){return false}}
function load(){ASKU.get('/schools').then(function(res){list.replaceChildren();var schools=res.schools||[];if(!schools.length){list.textContent='등록된 학교가 없습니다.';return}schools.forEach(function(s){var card=document.createElement('article');card.className='school';var head=document.createElement('div');head.className='schoolhead';var title=document.createElement('strong');title.textContent=s.name;head.appendChild(title);if(s.image_url){var image=document.createElement('img');image.src=s.image_url;image.alt='';image.onerror=function(){this.remove()};head.appendChild(image)}card.appendChild(head);var url=document.createElement('input');url.type='url';url.value=s.image_url||'';url.placeholder='대표 이미지 URL (https://...)';url.setAttribute('aria-label',s.name+' 대표 이미지 URL');card.appendChild(url);var actions=document.createElement('div');actions.className='row';actions.style.marginTop='10px';var save=document.createElement('button');save.className='button primary btn-accent';save.textContent='이미지 저장';save.onclick=function(){save.disabled=true;ASKU.patchAdmin('/schools/'+s.school_id,{image_url:url.value.trim()||null}).then(load).catch(function(e){alert(e.message)}).finally(function(){save.disabled=false})};var remove=document.createElement('button');remove.className='button btn-ink';remove.textContent='학교 삭제';remove.onclick=function(){if(!confirm('“'+s.name+'” 및 관련 문서·첨부·그래프·수집 이력을 삭제합니다. 수집 규격은 유지됩니다. 계속할까요?'))return;ASKU.deleteAdmin('/schools/'+s.school_id).then(load).catch(function(e){alert(e.message)})};actions.append(save,remove);card.appendChild(actions);list.appendChild(card)})}).catch(function(e){list.textContent='목록을 불러오지 못했습니다: '+e.message})}
function showManage(){login.classList.add('hidden');manage.classList.remove('hidden');load()}
$('loginBtn').onclick=function(){var b=$('loginBtn');b.disabled=true;ASKU.adminLogin($('password').value).then(showManage).catch(function(e){msg($('loginMsg'),e.message,true)}).finally(function(){b.disabled=false})};$('password').addEventListener('keydown',function(e){if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').onclick=function(){ASKU.adminLogout();manage.classList.add('hidden');login.classList.remove('hidden');$('password').value=''};if(authenticated())showManage();
})();
</script></body></html>
