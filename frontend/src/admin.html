<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASKU — 관리자</title>
<link rel="icon" type="image/svg+xml" href="assets/logo_A.svg">
<link rel="stylesheet" href="_ds/modernist-c94de0c9-726d-442a-9bb3-d3b24f39b8cb/styles.css">
<script src="api.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,Arial,sans-serif)}
button,input{font:inherit} button{cursor:pointer}.wrap{width:min(900px,calc(100% - 44px));margin:0 auto;padding:48px 0 80px}.top{display:flex;justify-content:space-between;align-items:start;gap:20px;border-bottom:3px solid currentColor;padding-bottom:28px}.k{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--color-accent,#ec3013)}h1{font-size:clamp(36px,6vw,64px);line-height:.9;letter-spacing:-.04em;margin:10px 0 0}.button{border:2px solid currentColor;background:transparent;padding:10px 14px;font-weight:800}.button.primary{background:var(--color-accent,#ec3013);border-color:var(--color-accent,#ec3013);color:#fff}.panel{margin-top:32px;padding:24px;border:2px solid color-mix(in srgb,currentColor 18%,transparent);background:var(--color-surface,#fff)}label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;margin:15px 0 6px}input{width:100%;border:2px solid currentColor;padding:11px;background:transparent}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.school{padding:20px 0;border-bottom:1px solid color-mix(in srgb,currentColor 20%,transparent)}.school:last-child{border:0}.schoolhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.school img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid currentColor}.msg{margin-top:15px;font-weight:700;line-height:1.5}.bad{color:#b42318}.hidden{display:none}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="k">ASKU · ADMIN</div><h1>학교 관리</h1></div><a class="button btn-ink" href="index.html">← 홈</a></div>
<section id="login" class="panel"><div class="k">인증 필요</div><h2>관리자 로그인</h2><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password"><div class="row" style="margin-top:16px"><button id="loginBtn" class="button primary btn-accent">로그인</button></div><div id="loginMsg" class="msg" aria-live="polite"></div></section>
<section id="manage" class="hidden"><div class="row" style="margin-top:28px;justify-content:space-between"><p style="margin:0;font-weight:700">학교명·공지 URL·대표 이미지를 고친 뒤 저장하세요. 바뀐 항목만 전송됩니다.</p><button id="logoutBtn" class="button btn-ink">로그아웃</button></div><div id="schools" class="panel"></div></section>
</main>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id)}, login=$('login'),manage=$('manage'), list=$('schools');
function msg(el,text,bad){el.textContent=text;el.className='msg'+(bad?' bad':'')}
// 이미 등록된 학교에 문서만 추가/삭제. 백엔드는 등록 직후와 같은 경로를 쓴다(01_backend-api.md §2.4).
var ATT={pending:'대기중',indexing:'색인중',ready:'완료',failed:'실패'};
function attachSection(s){
  var wrap=document.createElement('div');wrap.style.marginTop='14px';
  var head=document.createElement('div');head.className='k';head.textContent='문서';wrap.appendChild(head);
  var listEl=document.createElement('div');wrap.appendChild(listEl);
  var pick=document.createElement('input');pick.type='file';pick.multiple=true;pick.accept='.pdf,.hwp,.hwpx,.txt,.md';pick.setAttribute('aria-label',s.name+' 문서 추가');pick.style.marginTop='10px';wrap.appendChild(pick);
  var up=document.createElement('button');up.className='button btn-ink';up.textContent='문서 추가';up.style.marginTop='10px';wrap.appendChild(up);
  function rejectText(items){return items.map(function(x){return x.filename+': '+x.message}).join('\n')}
  up.onclick=function(){
    if(!pick.files.length){alert('추가할 파일을 고르세요.');return}
    up.disabled=true;
    ASKU.upload('/schools/'+s.school_id+'/attachments','files',pick.files).then(function(res){
      var rej=(res&&res.rejected)||[];if(rej.length)alert('일부 파일이 제외되었습니다:\n'+rejectText(rej));
      pick.value='';refresh();
    }).catch(function(e){
      var rej=e.details&&e.details.rejected;alert(rej&&rej.length?rejectText(rej):e.message);
    }).finally(function(){up.disabled=false});
  };
  function refresh(){
    ASKU.get('/schools/'+s.school_id+'/attachments').then(function(res){
      var items=(res&&res.attachments)||[];listEl.replaceChildren();
      if(!items.length){listEl.textContent='추가된 문서가 없습니다.';return}
      items.forEach(function(a){
        var row=document.createElement('div');row.className='row';row.style.justifyContent='space-between';row.style.padding='6px 0';
        var name=document.createElement('span');
        name.textContent=a.filename+' · '+(ATT[a.status]||a.status)
          +(a.status==='ready'?' · '+(a.chunk_count||0)+' 청크'+(a.truncated?' · 앞부분만 색인':''):'')
          +(a.status==='failed'&&a.error_code?' · '+a.error_code:'');
        var del=document.createElement('button');del.className='button btn-ink';del.textContent='✕';del.setAttribute('aria-label',a.filename+' 삭제');
        del.onclick=function(){if(!confirm('“'+a.filename+'” 문서와 그 색인을 삭제합니다. 계속할까요?'))return;
          ASKU.deleteAdmin('/schools/'+s.school_id+'/attachments/'+a.attachment_id).then(refresh).catch(function(e){alert(e.message)})};
        row.append(name,del);listEl.appendChild(row);
      });
      // 색인 중인 문서가 있으면 상태만 다시 확인한다. 카드가 갈아끼워지면(목록 재로드) 폴링도 멈춘다.
      if(items.some(function(a){return a.status==='pending'||a.status==='indexing'}))setTimeout(function(){if(wrap.isConnected)refresh()},2000);
    }).catch(function(e){listEl.textContent='문서 목록을 불러오지 못했습니다: '+e.message});
  }
  refresh();
  return wrap;
}
function authenticated(){try{return !!sessionStorage.getItem('asku_admin_token')}catch(_){return false}}

// 라벨 + 입력 한 쌍. id 를 학교마다 다르게 줘야 label[for] 이 엉키지 않는다.
function field(schoolId, key, labelText, value, type, hint){
  var wrap=document.createElement('div');
  var id='f-'+key+'-'+schoolId;
  var label=document.createElement('label');label.setAttribute('for',id);label.textContent=labelText;
  var input=document.createElement('input');input.id=id;input.type=type||'text';input.value=value||'';
  wrap.append(label,input);
  if(hint){
    var note=document.createElement('p');
    note.style.cssText='margin:6px 0 0;font-size:12px;line-height:1.5;opacity:.7';
    note.textContent=hint;wrap.appendChild(note);
  }
  return {wrap:wrap, input:input};
}

function schoolCard(s){
  var card=document.createElement('article');card.className='school';
  var head=document.createElement('div');head.className='schoolhead';
  var title=document.createElement('strong');title.textContent=s.name;head.appendChild(title);
  if(s.image_url){
    var image=document.createElement('img');image.src=s.image_url;image.alt='';
    image.onerror=function(){this.remove()};head.appendChild(image);
  }
  card.appendChild(head);

  var name=field(s.school_id,'name','학교명',s.name,'text');
  // 공지 URL 은 크롤러가 목록을 읽기 시작하는 지점이다. 게시판이 폐지·이전되면 여기를 고친다.
  var base=field(s.school_id,'base',"공지 URL",s.base_url,'url','바꿔도 이미 수집한 내용은 그대로다. 새 주소로 다시 모으려면 저장 후 재크롤링해야 한다.');
  var image=field(s.school_id,'image','대표 이미지 URL',s.image_url,'url','비우면 기본 표시로 돌아간다.');
  card.append(name.wrap,base.wrap,image.wrap);

  var actions=document.createElement('div');actions.className='row';actions.style.marginTop='14px';
  var save=document.createElement('button');save.className='button primary btn-accent';save.textContent='저장';
  save.onclick=function(){
    var body={}, nextName=name.input.value.trim(), nextBase=base.input.value.trim();
    // name·base_url 은 DB 에서 NOT NULL 이다. 빈 값을 보내면 서버가 null 로 지우려다 500 이 난다.
    if(!nextName){alert('학교명은 비울 수 없습니다.');return}
    if(!nextBase){alert('공지 URL 은 비울 수 없습니다.');return}
    if(nextName!==s.name)body.name=nextName;
    if(nextBase!==s.base_url)body.base_url=nextBase;
    // 대표 이미지만 비우기가 허용된다(null = 제거). 나머지와 달리 빈 문자열을 null 로 보낸다.
    var nextImage=image.input.value.trim()||null;
    if(nextImage!==(s.image_url||null))body.image_url=nextImage;
    if(!Object.keys(body).length){alert('변경된 내용이 없습니다.');return}
    save.disabled=true;
    ASKU.patchAdmin('/schools/'+s.school_id,body).then(load).catch(function(e){alert(e.message)}).finally(function(){save.disabled=false});
  };
  var remove=document.createElement('button');remove.className='button btn-ink';remove.textContent='학교 삭제';
  remove.onclick=function(){
    if(!confirm('“'+s.name+'” 및 관련 문서·첨부·그래프·수집 이력을 삭제합니다. 수집 규격은 유지됩니다. 계속할까요?'))return;
    ASKU.deleteAdmin('/schools/'+s.school_id).then(load).catch(function(e){alert(e.message)});
  };
  actions.append(save,remove);card.appendChild(actions);
  card.appendChild(attachSection(s));
  return card;
}

function load(){
  ASKU.get('/schools').then(function(res){
    list.replaceChildren();
    var schools=res.schools||[];
    if(!schools.length){list.textContent='등록된 학교가 없습니다.';return}
    schools.forEach(function(s){list.appendChild(schoolCard(s))});
  }).catch(function(e){list.textContent='목록을 불러오지 못했습니다: '+e.message});
}
function showManage(){login.classList.add('hidden');manage.classList.remove('hidden');load()}
$('loginBtn').onclick=function(){var b=$('loginBtn');b.disabled=true;ASKU.adminLogin($('password').value).then(showManage).catch(function(e){msg($('loginMsg'),e.message,true)}).finally(function(){b.disabled=false})};$('password').addEventListener('keydown',function(e){if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').onclick=function(){ASKU.adminLogout();manage.classList.add('hidden');login.classList.remove('hidden');$('password').value=''};if(authenticated())showManage();
})();
</script></body></html>
